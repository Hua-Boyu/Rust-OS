[package]
name = "tests_kernel"
version = "0.1.0"
edition = "2024"

[dependencies]
sha2 = { version = "=0.10.9", default-features = false, features = ["force-soft"] }
subtle = { version = "=2.6.1", default-features = false }
rostifs = { path = "../crates/rostifs", features = ["host-tools"] }

[features]
initramfs-failure-test = []

# Shared memory test sources also build in the independent B26 harness.
# Recognize its feature spelling without enabling it or suppressing cfg checks.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("b26-observation"))'] }

[workspace]

[lib]
test = true
doctest = false
