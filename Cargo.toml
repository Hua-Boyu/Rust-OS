[package]
name = "kernel"
version = "0.1.0"
edition = "2024"
resolver = "2"

[dependencies]
rostifs = { path = "crates/rostifs" }
sha2 = { version = "=0.10.9", default-features = false, features = ["force-soft"] }
subtle = { version = "=2.6.1", default-features = false }

[features]
default = []
# Local refusal/collision probes only; never package this kernel.
initramfs-failure-test = []
# Deliberate fatal fault for local QEMU verification only; never deploy this build.
paging-fault-test = []
paging-write-fault-test = ["paging-fault-test"]

[[bin]]
name = "kernel"
test = false
doctest = false
bench = false
